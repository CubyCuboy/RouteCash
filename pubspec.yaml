name: routecash
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  google_sign_in: ^7.2.0
  supabase_flutter: ^2.17.1
  shared_preferences: ^2.2.2
  flutter_dotenv: ^6.0.1
  http: ^1.2.0
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  nfc_manager: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
